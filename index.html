/* ===================================================================
   OCTAGONAL MEDALLION
=================================================================== */
.medallion{
  position:relative;
  z-index:2;
  width:min(520px,calc(100vw - 48px));
  aspect-ratio:1;
  filter:drop-shadow(0 30px 50px rgba(0,0,0,.55));
}

/* Outer concentric rings */
.ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(217,169,74,.15);
  pointer-events:none;
}
.ring.r1{inset:-6%}
.ring.r2{inset:-2%;border-color:rgba(217,169,74,.25)}

/* Octagonal frame */
.octagon{
  position:absolute;inset:0;
  clip-path:polygon(
    30% 0%,70% 0%,
    100% 30%,100% 70%,
    70% 100%,30% 100%,
    0% 70%,0% 30%);
  background:
    radial-gradient(ellipse at 50% 35%,#13404e 0%,#0a2a36 55%,#041a22 100%);
  box-shadow:
    inset 0 0 0 1px rgba(217,169,74,.3),
    0 20px 40px rgba(0,0,0,.5);
}

/* Inner octagon with gold border */
.octagon-inner{
  position:absolute;inset:6%;
  clip-path:polygon(
    30% 0%,70% 0%,
    100% 30%,100% 70%,
    70% 100%,30% 100%,
    0% 70%,0% 30%);
  background:
    radial-gradient(ellipse at 50% 35%,#1a5464 0%,#0e3a4a 55%,#061e26 100%);
}

/* Gold border ring between outer and inner octagons */
.octagon-border{
  position:absolute;inset:4%;
  clip-path:polygon(
    30% 0%,70% 0%,
    100% 30%,100% 70%,
    70% 100%,30% 100%,
    0% 70%,0% 30%);
  background:
    conic-gradient(from 0deg,
      #d9a94a 0deg,
      #b88930 30deg,
      #d9a94a 60deg,
      #ecc872 90deg,
      #d9a94a 120deg,

      #d9a94a 240deg,
      #b88930 270deg,

      #d9a94a 360deg);
  mask-image:radial-gradient(circle,transparent 80%,#000 80.5%);
  -webkit-mask-image:radial-gradient(circle,transparent 80%,#000 80.5%);
}

/* Sun-ray fan pattern inside */
.rays{

/* Central emblem with crossed suits */
.emblem{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:50%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:clamp(6px,1vw,10px);
  place-items:center;
  z-index:2;
}
.suit{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,5vw,56px);
  line-height:1;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
  font-weight:700;
}
.suit.spade{color:#eae0c2}
.suit.heart{color:#d9a94a}
.suit.diamond{color:#d9a94a}
.suit.club{color:#eae0c2}

/* Center emblem circle (overlaps grid) */
.emblem-center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:38%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#1a5464 0%,#0a2a36 70%,#03151b 100%);
  border:1.5px solid rgba(217,169,74,.7);
  box-shadow:
    inset 0 0 20px rgba(0,0,0,.6),
    0 0 20px rgba(217,169,74,.2);
  display:grid;place-items:center;
  z-index:3;
}
.emblem-center::before{
  content:"P";
  font-family:Georgia,serif;
  font-size:clamp(24px,4vw,44px);
  color:#d9a94a;
  font-style:italic;
  font-weight:600;
  text-shadow:0 2px 4px rgba(0,0,0,.6);
}

/* Mint accent arcs at corners of medallion */
.arc{
  position:absolute;
  width:clamp(40px,6vw,70px);
  height:1px;
  background:linear-gradient(90deg,transparent,#8ac6b8,transparent);
  opacity:.6;
}
.arc.top{top:46%;left:0;transform:rotate(45deg) translateX(-20%)}
.arc.right{top:46%;right:0;transform:rotate(-45deg) translateX(20%)}
.arc.bot-l{bottom:46%;left:0;transform:rotate(-45deg) translateX(-20%)}
.arc.bot-r{bottom:46%;right:0;transform:rotate(45deg) translateX(20%)}

    inset 0 -1px 0 rgba(0,0,0,.2);
  transition:transform .3s ease,filter .3s ease,box-shadow .3s ease;
  position:relative;
  overflow:hidden;
  z-index:3;
}
.cta::before{
  /* Mint shimmer */
  content:"";position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(138,198,184,.4),transparent);
  transition:left .7s ease;
}
.cta:hover{
  transform:translateY(-2px);
  filter:brightness(1.07);
  box-shadow:
    0 24px 48px rgba(217,169,74,.35),
    0 0 0 1px rgba(236,200,114,.35),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.2);
}
.cta:hover::before{left:100%}
.cta:active{transform:translateY(0)}
.cta svg{width:18px;height:18px;flex:none;position:relative;z-index:1}
.cta span{position:relative;z-index:1;white-space:nowrap}
